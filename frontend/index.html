<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca FastAPI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <h1>Biblioteca</h1>
        <section class="card">
            <h2>Novo livro</h2>
            <form id="formLivro">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" minlength="3" maxlength="100" required>
                <label for="autor">Autor</label>
                <input type="text" id="autor" minlength="3" maxlength="100" required>
                <label for="ano_publicacao">Ano de publicação</label>
                <input type="number" id="ano_publicacao" required>
                <button type="submit">Adicionar livro</button>
            </form>
            <p id="mensagem" role="status"></p>
        </section>
        <section class="card">
            <h2>Livros cadastrados</h2>
            <div id="livrosList"></div>
        </section>
    </main>
    <script src="/static/js/script.js" defer></script>
</body>
</html>
